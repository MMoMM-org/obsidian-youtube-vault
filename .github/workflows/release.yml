name: Release
on:
  push:
    branches:
      - main
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      # The main-branch ruleset requires CodeQL results for every commit,
      # which semantic-release's own release commit can never have. The
      # GitHub Actions app cannot be a ruleset bypass actor, so the push
      # runs as our own release GitHub App, which is a bypass actor
      # (#1). Merges via PR stay CodeQL-gated. The `[skip ci]` in the
      # release commit message keeps the app's push from retriggering
      # workflows (unlike GITHUB_TOKEN, an app token would).
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

